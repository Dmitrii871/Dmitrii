# УСКОРЕННАЯ ПРОВЕРКА МЕХАНИКИ трендового бота: те же каналы Дончиана,
# но на ЧАСОВЫХ свечах — пробои каждый день, за 2-3 дня механика
# прогоняется целиком. ВАЖНО: этот конфиг НЕ для заработка — край
# измерен только на дневках. После проверки вернуть config.trend.yaml.
#
# ТРЕНДОВЫЙ БОТ: канал Дончиана на дневных свечах.
# Единственная механика, прошедшая проверку историей (tools/trend.py):
# 5/5 монет в плюсе за 5-6 лет, каждый год кроме 2021 положительный.
#
# ЧЕГО ЖДАТЬ (это написано, чтобы не выключить бота в худший момент):
#   - винрейт ~35-40%: большинство сделок — мелкие убытки
#   - серии до 9 убыточных подряд — это НОРМА, а не поломка
#   - просадки до полутора размеров позиции на монету
#   - прибыль приходит редкими крупными движениями, ждать их — неделями
#
# Включение: cp config.trend.yaml config.yaml && ./start.sh

testnet: true          # ордера на тестовый контур; данные всегда с основного
dry_run: true          # бумажный режим: сделки только в журнале

# Пять монет, проверенных историей. Не добавляйте мелочь без прогона tools/trend.py.
symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - XRPUSDT
  - DOGEUSDT

category: linear
leverage: 1            # тренду плечо не нужно: просадки и так до 1.5x позиции

strategy:
  name: trend
  trend:
    interval: "60"     # ЧАСОВЫЕ свечи — только для ускоренной проверки механики!
    enter_days: 20     # вход: пробой максимума/минимума за 20 дней
    exit_days: 10      # выход: обратный экстремум за 10 дней
    order_notional_usdt: 20
    # Минимальные лоты биржи: BTC ~0.001 BTC (≈80 USDT), ETH 0.01 (≈25).
    # Меньше минимума ордер невозможен — размер задаётся на символ.
    notional_overrides:
      BTCUSDT: 85
      ETHUSDT: 27
    direction: both
    disaster_stop_pct: 15   # аварийный стоп на бирже — если бот умрёт

risk:
  max_position_usdt: 175        # BTC 85 + ETH 27 + 3x20, на весь счёт
  max_daily_loss_usdt: 15       # дневной стоп: ~3% счёта; тренд теряет сериями
  max_loss_streak: 12           # больше худшей исторической серии (9)
  kill_switch_file: ./STOP

poll_seconds: 60       # чаще: уровни меняются каждый час
request_gap_seconds: 0.3
heartbeat_seconds: 3600

journal_file: journal.csv
trades_file: trades.csv
paper_equity: 500
log_level: INFO
lock_file: ./bot.lock
