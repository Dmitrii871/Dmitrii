  Ожидается волна b к 0.618 отката = 93500, ориентир конец февраля 2027.
  Затем волна c к 40000-45000. Сетка Фибоначчи построена от 41127 до 125873
  (волна 4 -> волна 5), восстановлена по подписанным уровням 0.382 и 0.618.

# Среднесрочное смещение на время волны b — вверх.
