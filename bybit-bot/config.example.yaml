# ---------------------------------------------------------------
# Копия -> config.yaml. Значения ниже намеренно безопасные.
# testnet: true и dry_run: true = ноль реальных денег в обороте.
# ---------------------------------------------------------------
symbol: ETHUSDT
category: linear          # linear = USDT-бессрочные
testnet: true             # false -> реальные деньги. Требует флага --live
dry_run: true             # true -> ордера только логируются, не отправляются
leverage: 3
poll_seconds: 10
log_level: INFO

# Комиссии вашего VIP-уровня, в базисных пунктах (1 bp = 0.01%)
fees:
  maker_bps: 2.0
  taker_bps: 5.5

strategy:
  name: signal            # signal | maker

  # Режим 1: вход по совпадению индикаторов (те же, что у вас на графике)
  #
  # ВЫБОР ТАЙМФРЕЙМА. Перед сменой interval прогоните:
  #     python tools/timeframe_check.py --symbol ETHUSDT --interval 3
  # Он покажет, превышает ли типичное движение свечи стоимость круга.
  # На 3m медианная свеча ETH ~5 bp, а круг тейкером стоит 11 bp —
  # поэтому на коротких таймфреймах обязателен entry_type: post_only,
  # иначе стратегия убыточна по построению.
  signal:
    interval: "30"        # минуты: 1 3 5 15 30 60 240 D

    # market    -> вход рыночным ордером, комиссия тейкера, гарантия исполнения
    # post_only -> вход лимиткой на ближней стороне книги, комиссия мейкера,
    #              но часть сигналов не исполнится (цена уйдёт)
    entry_type: market
    entry_ttl_seconds: 90   # незалившаяся лимитка снимается через столько секунд

    rsi_period: 14
    rsi_buy: 35.0         # ниже -> сигнал в лонг
    rsi_sell: 65.0        # выше -> сигнал в шорт
    macd: [12, 26, 9]
    bb_period: 20
    bb_mult: 2.0
    bb_buy: 0.15          # %B ниже -> перепроданность
    bb_sell: 0.85
    min_confluence: 2     # сколько индикаторов из 3 должны согласиться
    order_notional_usdt: 25
    take_profit_pct: 1.2
    stop_loss_pct: 0.8
    cooldown_bars: 2      # не входить повторно раньше, чем через N свечей

  # --- Готовый профиль для 3m ---------------------------------------
  # Скопируйте его содержимое в signal: выше, если торгуете на 3-минутке.
  # Отличия от 30m: вход мейкером, вдвое строже отбор сигналов,
  # тейк-профит с трёхкратным запасом над комиссией, длинный кулдаун.
  #
  #   interval: "3"
  #   entry_type: post_only
  #   entry_ttl_seconds: 60
  #   min_confluence: 3          # согласие всех трёх индикаторов
  #   rsi_buy: 25.0              # только выраженная перепроданность
  #   rsi_sell: 75.0
  #   bb_buy: 0.05
  #   bb_sell: 0.95
  #   take_profit_pct: 0.30      # 30 bp против 7.5 bp круга мейкером
  #   stop_loss_pct: 0.20
  #   cooldown_bars: 10          # 30 минут паузы между входами
  #   order_notional_usdt: 25
  # -------------------------------------------------------------------

  # Режим 2: маркет-мейкинг. Реальный оборот по ставке мейкера.
  maker:
    spread_bps: 8.0       # половина спреда от mid с каждой стороны
    order_notional_usdt: 25
    max_inventory_usdt: 60
    refresh_bps: 3.0      # переставлять котировки при сдвиге mid на столько
    inventory_skew: 1.0   # >0 -> при перекосе инвентаря котировки смещаются к его сокращению

risk:
  max_position_usdt: 60
  max_daily_loss_usdt: 5.0      # достигнут -> бот закрывается и останавливается
  min_free_margin_ratio: 0.25   # свободная маржа не ниже 25% от equity
  max_orders_per_hour: 120
  kill_switch_file: ./STOP      # создайте этот файл -> бот аккуратно остановится
