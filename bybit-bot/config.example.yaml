# ---------------------------------------------------------------
# Копия -> config.yaml. Значения ниже намеренно безопасные.
# testnet: true и dry_run: true = ноль реальных денег в обороте.
# ---------------------------------------------------------------
symbol: ETHUSDT
category: linear          # linear = USDT-бессрочные
testnet: true             # false -> реальные деньги. Требует флага --live
dry_run: true             # true -> ордера только логируются, не отправляются
leverage: 3
poll_seconds: 10
heartbeat_seconds: 300   # как часто печатать строку СТАТУС

# В режиме dry_run бот ведёт позицию на бумаге по живым ценам и пишет
# журнал решений: индикаторы, режим рынка, действие и его причина.
# Так сухой прогон отвечает не только «не падает ли бот», но и
# «зарабатывал бы он». Уберите строку, чтобы журнал не писался.
journal_file: journal.csv
paper_equity: 500     # условный баланс, если ключей нет
log_level: INFO

# Внешняя разметка рынка: уровни, направленное смещение и цена отмены
# сценария. Действует как ФИЛЬТР — против смещения бот не входит, но и
# открыть позицию сам план не может. Закомментируйте, чтобы отключить.
# plan_file: plans/ETHUSDT.yaml

# Комиссии вашего VIP-уровня, в базисных пунктах (1 bp = 0.01%)
fees:
  maker_bps: 2.0
  taker_bps: 5.5

strategy:
  name: signal            # signal | maker

  # Режим 1: вход по совпадению индикаторов (те же, что у вас на графике)
  #
  # ВЫБОР ТАЙМФРЕЙМА. Перед сменой interval прогоните:
  #     python tools/timeframe_check.py --symbol ETHUSDT --interval 3
  # Он покажет, превышает ли типичное движение свечи стоимость круга.
  # На 3m медианная свеча ETH ~5 bp, а круг тейкером стоит 11 bp —
  # поэтому на коротких таймфреймах обязателен entry_type: post_only,
  # иначе стратегия убыточна по построению.
  signal:
    # 60 = 1 час. Выбрано по данным tools/timeframe_sweep.py: запас над
    # комиссией 5.8x при входе мейкером и ~22 сделки в месяц — единственный
    # таймфрейм, где запас достаточен, а выборка набирается за пару месяцев.
    interval: "60"        # минуты: 1 3 5 15 30 60 240 D

    # reversion -> покупаем перепроданность (ловим разворот)
    # momentum  -> покупаем силу (идём за трендом)
    # auto      -> режим выбирается по ADX: слабый тренд — разворот,
    #              сильный — импульс, между порогами сделок нет
    mode: reversion
    adx_period: 14
    adx_range_max: 20.0    # ADX ниже -> боковик
    adx_trend_min: 25.0    # ADX выше -> тренд

    # market    -> вход рыночным ордером, комиссия тейкера, гарантия исполнения
    # post_only -> вход лимиткой на ближней стороне книги, комиссия мейкера,
    #              но часть сигналов не исполнится (цена уйдёт)
    # Найденный край — 6.7 bp. Круг мейкер+тейкер стоит 7.5 bp (убыток),
    # круг мейкер+мейкер — 4.0 bp (прибыль +2.7 bp). Разница между минусом
    # и плюсом здесь в ИСПОЛНЕНИИ, а не в стратегии.
    # exchange_tpsl — выход по TP/SL на бирже, всегда тейкер
    # maker_chase   — выход лимиткой у края книги по ставке мейкера
    exit_type: maker_chase
    exit_ttl_bars: 12       # не исполнилось за столько баров — выходим рынком
    exit_panic_pct: 1.5     # ушло против позиции на столько — выходим рынком

    entry_type: post_only
    entry_ttl_seconds: 120  # незалившаяся лимитка снимается через столько секунд

    # both       -> торговать в обе стороны (по умолчанию)
    # long_only  -> только лонги
    # short_only -> только шорты; осмысленно, когда фандинг устойчиво
    #               положительный: тогда шорт получает выплаты, а не платит
    direction: both

    rsi_period: 14
    rsi_buy: 35.0         # ниже -> сигнал в лонг
    rsi_sell: 65.0        # выше -> сигнал в шорт
    macd: [12, 26, 9]
    bb_period: 20
    bb_mult: 2.0
    bb_buy: 0.15          # %B ниже -> перепроданность
    bb_sell: 0.85
    min_confluence: 2     # сколько индикаторов из 3 должны согласиться
    order_notional_usdt: 25
    # Значения ниже — отправная точка, а не рекомендация. Подбирайте их
    # оптимизатором на своих данных: python tools/optimize.py
    #
    # Главное правило: стоп должен быть ШИРЕ обычного шума. Медианная
    # часовая свеча ETH около 59 bp, поэтому стоп 0.4% (40 bp) выбивало бы
    # рядовым фитилём, а не разворотом рынка. Ориентир — 1.5-2 медианных
    # свечи; проверить текущую можно так:
    #     python tools/timeframe_check.py --symbol ETHUSDT --interval 60
    take_profit_pct: 1.3  # 130 bp
    stop_loss_pct: 0.9    # 90 bp = ~1.5 медианной свечи, риск/прибыль 1:1.44
    cooldown_bars: 2      # не входить повторно раньше, чем через N свечей

  # --- Готовый профиль для 3m ---------------------------------------
  # Скопируйте его содержимое в signal: выше, если торгуете на 3-минутке.
  # Отличия от 30m: вход мейкером, вдвое строже отбор сигналов,
  # тейк-профит с трёхкратным запасом над комиссией, длинный кулдаун.
  #
  #   interval: "3"
  #   entry_type: post_only
  #   entry_ttl_seconds: 60
  #   min_confluence: 3          # согласие всех трёх индикаторов
  #   rsi_buy: 25.0              # только выраженная перепроданность
  #   rsi_sell: 75.0
  #   bb_buy: 0.05
  #   bb_sell: 0.95
  #   take_profit_pct: 0.30      # 30 bp против 7.5 bp круга мейкером
  #   stop_loss_pct: 0.20
  #   cooldown_bars: 10          # 30 минут паузы между входами
  #   order_notional_usdt: 25
  # -------------------------------------------------------------------

  # Режим 2: маркет-мейкинг. Реальный оборот по ставке мейкера.
  maker:
    spread_bps: 8.0       # половина спреда от mid с каждой стороны
    order_notional_usdt: 25
    max_inventory_usdt: 60
    refresh_bps: 3.0      # переставлять котировки при сдвиге mid на столько
    inventory_skew: 1.0   # >0 -> при перекосе инвентаря котировки смещаются к его сокращению

risk:
  # Согласуйте с депозитом: max_position_usdt / leverage — это маржа, которую
  # займёт позиция. Если после её открытия свободной маржи останется меньше
  # min_free_margin_ratio, бот откажется стартовать и подскажет верное значение.
  # Значение ниже рассчитано на депозит около 40 USDT при плече 3x.
  max_position_usdt: 30
  max_daily_loss_usdt: 2.0      # за календарный день UTC, счётчик обнуляется в 00:00
  min_free_margin_ratio: 0.25   # свободная маржа не ниже 25% от equity
  max_orders_per_hour: 120
  kill_switch_file: ./STOP      # создайте этот файл -> бот аккуратно остановится
